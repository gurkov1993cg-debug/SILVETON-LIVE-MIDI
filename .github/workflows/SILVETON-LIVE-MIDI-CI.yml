name: SILVETON LIVE MIDI CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-release:
    name: Core Release Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure core (Release)
        run: cmake -S core -B build-core -DSILVETON_LIVE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build core (Release)
        run: cmake --build build-core -j 2

      - name: Run core tests (Release)
        run: ctest --test-dir build-core --output-on-failure

  core-sanitizers:
    name: Core ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure core (ASan + UBSan)
        run: >-
          cmake -S core -B build-sanitize
          -DSILVETON_LIVE_BUILD_TESTS=ON
          -DSILVETON_LIVE_ENABLE_SANITIZERS=ON
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build core (ASan + UBSan)
        run: cmake --build build-sanitize -j 2

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-sanitize --output-on-failure

  android-build:
    name: Android APK Build
    runs-on: ubuntu-latest
    needs:
      - core-release
      - core-sanitizers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SILVETON-LIVE-MIDI-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
